<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Description Timestamps</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #d32f2f;
            text-align: center;
        }
        #stream-title {
            color: #555;
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        .timer {
            font-size: 3em;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            color: #4CAF50;
            font-family: monospace;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .controls button {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 4px;
            cursor: pointer;
        }
        .controls button:hover {
            background-color: #1565c0;
        }
        .controls button.btn-prev {
            background-color: #ff9800;
        }
        .controls button.btn-prev:hover {
            background-color: #e68a00;
        }
        .section {
            margin-top: 20px;
        }
        .section h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        li:last-child {
            border-bottom: none;
        }
        .future-item {
            color: #777;
        }
        .past-item {
            color: #333;
            font-weight: bold;
        }
        .active-target {
            color: #d32f2f;
            font-weight: bold;
        }
        .timestamp {
            color: #1976d2;
            margin-right: 10px;
        }
        .menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 100;
        }
        .menu-overlay {
            display: none;
            position: absolute;
            top: 50px;
            right: 20px;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 4px;
            z-index: 99;
            width: 300px;
        }
        .menu-overlay.active {
            display: block;
        }
        .menu-overlay input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .menu-overlay button {
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .btn-set {
            background-color: #1976d2;
            color: white;
        }
        .btn-reset {
            background-color: #d32f2f;
            color: white;
        }
        .btn-push {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .btn-danger {
            background-color: #ff9800;
            color: white;
        }
        .btn-sample {
            background-color: #9c27b0;
            color: white;
            margin-top: 15px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-row input {
            margin-bottom: 0;
            flex-grow: 1;
        }
        .input-row button {
            margin-bottom: 0;
            width: auto;
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="menu-overlay" id="menuOverlay">
            <h3>Configuration</h3>
            <p style="font-size: 0.9em; color: #666; margin-top: 0;">Listening for incoming OSC commands on port:</p>
            <div class="input-row">
                <input type="number" id="oscPortInput" placeholder="8000" min="1" max="65535" />
                <button class="btn-set" onclick="setOscPort()">Save</button>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;" />

            <h3>Actions</h3>
            <button class="btn-push" onclick="pushTimestamps()">Push Timings to GitHub</button>
            <button class="btn-danger" onclick="resetState()">Reset Local State</button>

            <button class="btn-sample" onclick="loadSampleData()">Load Sample List (Mock API)</button>

            <h3 style="margin-top:20px;">Test Mode Override</h3>
            <p style="font-size: 0.9em; color: #666; margin-top: 0;">Set a specific YouTube URL/ID to override the default FCCLA stream discovery.</p>
            <input type="text" id="overrideLink" placeholder="https://youtube.com/watch?v=..." />
            <button class="btn-set" onclick="setOverride()">Set Override</button>
            <button class="btn-reset" onclick="clearOverride()">Clear Override</button>
        </div>

        <h1>Live Stream Timestamps</h1>
        <div id="stream-title">Loading stream details...</div>

        <div class="controls">
            <button class="btn-prev" onclick="prevTiming()">⬆ Previous Timing</button>
            <button onclick="nextTiming()">⬇ Next Timing</button>
        </div>

        <div class="timer" id="timer">00:00:00</div>

        <div class="section">
            <ul id="unified-list">
                <li>Waiting for data...</li>
            </ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let startTime = null;
        let timerInterval = null;

        function toggleMenu() {
            document.getElementById('menuOverlay').classList.toggle('active');
        }

        function setOverride() {
            const link = document.getElementById('overrideLink').value;
            if (link) {
                socket.emit('setOverrideLink', link);
                toggleMenu();
            }
        }

        function clearOverride() {
            socket.emit('clearOverrideLink');
            document.getElementById('overrideLink').value = '';
            toggleMenu();
        }

        function pushTimestamps() {
            if(confirm("Are you sure you want to push the final timings to GitHub? This usually happens automatically when the stream ends.")) {
                socket.emit('pushTimestamps');
                toggleMenu();
            }
        }

        function resetState() {
            if(confirm("Are you sure you want to reset the local state? This will clear all recorded timestamps and re-fetch the chapters from GitHub.")) {
                socket.emit('resetState');
                toggleMenu();
            }
        }

        function loadSampleData() {
            socket.emit('loadSampleData');
            toggleMenu();
        }

        function setOscPort() {
            const port = document.getElementById('oscPortInput').value;
            if (port) {
                socket.emit('setOscPort', port);
                toggleMenu();
            }
        }

        function nextTiming() {
            socket.emit('nextTiming');
        }

        function prevTiming() {
            socket.emit('prevTiming');
        }

        function updateTimer() {
            if (!startTime) {
                document.getElementById('timer').innerText = "00:00:00";
                return;
            }

            const now = Date.now();
            let totalSeconds = Math.floor((now - startTime) / 1000);
            if (totalSeconds < 0) totalSeconds = 0;

            const hours = Math.floor(totalSeconds / 3600);
            const remainder = totalSeconds % 3600;
            const minutes = Math.floor(remainder / 60);
            const seconds = remainder % 60;

            const hStr = hours.toString().padStart(2, '0');
            const mStr = minutes.toString().padStart(2, '0');
            const sStr = seconds.toString().padStart(2, '0');

            document.getElementById('timer').innerText = `${hStr}:${mStr}:${sStr}`;
        }

        socket.on('stateUpdate', (state) => {
            console.log("Received state:", state);

            if (state.oscPort) {
                document.getElementById('oscPortInput').value = state.oscPort;
            }

            if (state.error) {
                document.getElementById('stream-title').innerText = state.error;
                startTime = null;
                updateTimer();
                return;
            }

            if (state.title) {
                document.getElementById('stream-title').innerText = state.title;
            }

            if (state.actualStartTime) {
                startTime = new Date(state.actualStartTime).getTime();
                if (!timerInterval) {
                    timerInterval = setInterval(updateTimer, 1000);
                }
                updateTimer();
            } else {
                startTime = null;
                document.getElementById('timer').innerText = "Not Started";
            }

            const unifiedList = document.getElementById('unified-list');
            unifiedList.innerHTML = '';

            if ((!state.past || state.past.length === 0) && (!state.upcoming || state.upcoming.length === 0)) {
                unifiedList.innerHTML = '<li>Waiting for data...</li>';
                return;
            }

            // Render past items
            if (state.past && state.past.length > 0) {
                state.past.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'past-item';

                    const match = item.match(/^(\d{1,2}:)?\d{1,2}:\d{2}/);
                    if (match) {
                        const timeStr = match[0];
                        const rest = item.substring(timeStr.length);
                        li.innerHTML = `<span class="timestamp">${timeStr}</span>${rest}`;
                    } else {
                        li.innerText = item;
                    }
                    unifiedList.appendChild(li);
                });
            }

            // Render upcoming items
            if (state.upcoming && state.upcoming.length > 0) {
                state.upcoming.forEach((item, index) => {
                    const li = document.createElement('li');

                    if (index === 0) {
                        li.className = 'active-target';
                        li.innerHTML = `<span style="margin-right:8px;">&rarr;</span>${item}`;
                    } else {
                        li.className = 'future-item';
                        li.innerText = item;
                    }

                    unifiedList.appendChild(li);
                });
            }
        });

        socket.emit('requestState');
    </script>
</body>
</html>
