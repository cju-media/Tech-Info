<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Description Timestamps</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #d32f2f;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .timer {
            font-size: 3em;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: #4CAF50;
            font-family: monospace;
        }
        .section {
            margin-top: 20px;
        }
        .section h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        li:last-child {
            border-bottom: none;
        }
        .upcoming li {
            color: #777;
        }
        .past li {
            color: #333;
            font-weight: bold;
        }
        .timestamp {
            color: #1976d2;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Stream Timestamps</h1>
        <div class="timer" id="timer">00:00:00</div>

        <div class="section">
            <h2>Past Timings</h2>
            <ul id="past-list" class="past">
                <li>Waiting for data...</li>
            </ul>
        </div>

        <div class="section">
            <h2>Upcoming Sections</h2>
            <ul id="upcoming-list" class="upcoming">
                <li>Waiting for data...</li>
            </ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let startTime = null;
        let timerInterval = null;

        function updateTimer() {
            if (!startTime) return;

            const now = Date.now();
            let totalSeconds = Math.floor((now - startTime) / 1000);
            if (totalSeconds < 0) totalSeconds = 0;

            const hours = Math.floor(totalSeconds / 3600);
            const remainder = totalSeconds % 3600;
            const minutes = Math.floor(remainder / 60);
            const seconds = remainder % 60;

            const hStr = hours.toString().padStart(2, '0');
            const mStr = minutes.toString().padStart(2, '0');
            const sStr = seconds.toString().padStart(2, '0');

            document.getElementById('timer').innerText = `${hStr}:${mStr}:${sStr}`;
        }

        socket.on('stateUpdate', (state) => {
            console.log("Received state:", state);

            if (state.actualStartTime) {
                startTime = new Date(state.actualStartTime).getTime();
                if (!timerInterval) {
                    timerInterval = setInterval(updateTimer, 1000);
                }
                updateTimer();
            }

            const pastList = document.getElementById('past-list');
            pastList.innerHTML = '';
            if (state.past && state.past.length > 0) {
                state.past.forEach(item => {
                    const li = document.createElement('li');

                    // highlight the timestamp
                    const match = item.match(/^(\d{1,2}:)?\d{1,2}:\d{2}/);
                    if (match) {
                        const timeStr = match[0];
                        const rest = item.substring(timeStr.length);
                        li.innerHTML = `<span class="timestamp">${timeStr}</span>${rest}`;
                    } else {
                        li.innerText = item;
                    }
                    pastList.appendChild(li);
                });
            } else {
                pastList.innerHTML = '<li>No timestamps added yet.</li>';
            }

            const upcomingList = document.getElementById('upcoming-list');
            upcomingList.innerHTML = '';
            if (state.upcoming && state.upcoming.length > 0) {
                state.upcoming.forEach(item => {
                    const li = document.createElement('li');
                    li.innerText = item;
                    upcomingList.appendChild(li);
                });
            } else {
                upcomingList.innerHTML = '<li>No upcoming sections left!</li>';
            }
        });

        socket.emit('requestState');
    </script>
</body>
</html>
