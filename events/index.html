<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Downloads Directory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Event Downloads</h1>

        <div class="controls">
            <input type="text" id="search-input" placeholder="Search events by name or date..." aria-label="Search events">
        </div>

        <div id="status">Loading events...</div>

        <div class="table-container">
            <table id="events-table">
                <thead>
                    <tr>
                        <th tabindex="0" role="button" aria-sort="none" data-sort="createdTime">
                            Date <span class="sort-icon"></span>
                        </th>
                        <th tabindex="0" role="button" aria-sort="none" data-sort="name">
                            Name <span class="sort-icon"></span>
                        </th>
                    </tr>
                </thead>
                <tbody id="events-tbody">
                    <!-- Event rows will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
