<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Open in app</title>
<style>
  :root { color-scheme: light dark; --bg:#F3F5F8; --ink:#18202C; --muted:#5B6678; --accent:#2754C5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10151D; --ink:#E6EAF1; --muted:#98A3B5; --accent:#7FA2F5; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px; box-sizing:border-box; text-align:center; }
  main { max-width:420px; width:100%; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:20px; margin:0; }
  p { margin:0; color:var(--muted); }
  a.go { display:block; padding:16px; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; font-size:18px; text-decoration:none; }
  @media (prefers-color-scheme: dark) { a.go { color:#0E1522; } }
  .err { color:#B42318; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening…</h1>
  <p id="sub"></p>
  <a class="go" id="go" href="#" hidden>Open</a>
  <p id="hint" hidden>If nothing happens, tap the button above.</p>
</main>
<script>
// Launcher for app links that can't be opened from inside a sandboxed page.
// Only Messages (sms:), Apple Mail (message:) and Reminders links are allowed, so this
// page can't be used to redirect anyone to another website.
(function () {
  var q = new URLSearchParams(location.search);
  var target = q.get("u") || "";
  var label = (q.get("l") || "").slice(0, 80);
  var rules = [
    { re: /^sms:\+?[0-9]{7,15}$/, app: "Messages" },
    { re: /^message:\/\/%3C[A-Za-z0-9!#$&'*+\-.\/=?^_`{|}~@%]{3,300}%3E$/, app: "Mail" },
    { re: /^x-apple-reminderkit:\/\/REMCDReminder\/[0-9A-Fa-f-]{36}$/, app: "Reminders" }
  ];
  var match = null;
  for (var i = 0; i < rules.length; i++) if (rules[i].re.test(target)) { match = rules[i]; break; }
  var title = document.getElementById("title"), sub = document.getElementById("sub");
  if (!match) {
    title.textContent = "This link can't be opened";
    sub.textContent = "Only Messages, Mail and Reminders links are supported.";
    sub.className = "err";
    return;
  }
  title.textContent = "Open in " + match.app;
  sub.textContent = label;
  var go = document.getElementById("go");
  go.href = target;
  go.textContent = "Open in " + match.app;
  go.hidden = false;
  var hint = document.getElementById("hint");
  hint.hidden = false;
  // Once the app takes over, this page goes to the background; close it then.
  // Browsers only let a page close itself if it was opened as a new tab/window,
  // so if it's still here when the user comes back, say it can be closed.
  var launched = false;
  go.addEventListener("click", function () { launched = true; });
  document.addEventListener("visibilitychange", function () {
    if (!launched) return;
    if (document.hidden) {
      window.close();
    } else {
      title.textContent = "Opened in " + match.app;
      hint.textContent = "You can close this tab.";
    }
  });
  // Try right away; Safari may ask "Open in …?" first.
  setTimeout(function () { launched = true; location.href = target; }, 50);
})();
</script>
</body>
</html>
