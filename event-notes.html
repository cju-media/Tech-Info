<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Notes</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #333;
        margin: 0;
        padding: 24px 20px 60px;
        background: #fff;
        line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .meta { color: #666; font-size: 14px; margin-bottom: 20px; }
    .meta span + span::before { content: " · "; }
    .notes {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 15px;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        padding: 16px 18px;
    }
    .empty { color: #888; font-style: italic; }
    .links { margin-top: 22px; font-size: 14px; }
    .links a { color: #2563eb; text-decoration: none; }
    .links a + a { margin-left: 16px; }
    .error { color: #b02a37; }
    @media (prefers-color-scheme: dark) {
        body { background: #1b1b1b; color: #e3e3e3; }
        .notes { background: #262626; border-color: #3a3a3a; }
        .meta, .empty { color: #9a9a9a; }
        .links a { color: #6ea8fe; }
    }
</style>
</head>
<body>
<div class="wrap">
    <h1 id="title">Calendar Notes</h1>
    <div class="meta" id="meta"></div>
    <div id="content"><p>Loading…</p></div>
    <div class="links" id="links"></div>
</div>
<script>
    var SHEET_ID = '1UC8vgy89W14bVEWROqdUc9VgkMTGykC5ZZJqSDmi2-A';
    var GID = '251348517';

    var params = new URLSearchParams(location.search);
    var row = parseInt(params.get('row'), 10);

    var titleEl = document.getElementById('title');
    var metaEl = document.getElementById('meta');
    var contentEl = document.getElementById('content');
    var linksEl = document.getElementById('links');

    function fail(msg) {
        contentEl.innerHTML = '<p class="error">' + msg + '</p>';
    }

    if (!row || row < 1) {
        fail('No event specified. Open this page from an event on the dashboard.');
    } else {
        var cb = 'handleNotes_' + Math.floor(Math.random() * 100000);
        window[cb] = function (resp) {
            try {
                var rows = resp.table.rows;
                var r = rows[row - 1];
                if (!r) { fail('That event row was not found on the schedule sheet.'); return; }
                var cell = function (i) { return (r.c[i] && r.c[i].v != null) ? String(r.c[i].v) : ''; };

                var date = cell(0).trim();
                var name = cell(1).trim() || 'Event';
                var venue = cell(2).trim();
                var notes = cell(11).replace(/\r\n/g, '\n').trim();

                document.title = name + ' — Calendar Notes';
                titleEl.textContent = name;
                var bits = [];
                if (date) bits.push('<span>' + date + '</span>');
                if (venue) bits.push('<span>' + venue + '</span>');
                metaEl.innerHTML = bits.join('');

                if (notes) {
                    var box = document.createElement('div');
                    box.className = 'notes';
                    box.textContent = notes;
                    contentEl.innerHTML = '';
                    contentEl.appendChild(box);
                } else {
                    contentEl.innerHTML = '<p class="empty">No calendar notes for this event.</p>';
                }

                linksEl.innerHTML =
                    '<a href="https://docs.google.com/spreadsheets/d/' + SHEET_ID +
                    '/edit?gid=' + GID + '&range=' + row + ':' + row + '" target="_blank" rel="noopener">Open row in Google Sheet</a>' +
                    '<a href="index.html">Back to dashboard</a>';
            } catch (e) {
                fail('Could not read the schedule sheet: ' + e.message);
            }
        };

        var s = document.createElement('script');
        s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
                '/gviz/tq?gid=' + GID + '&headers=0&tqx=responseHandler:' + cb;
        s.onerror = function () { fail('Could not reach the schedule sheet.'); };
        document.head.appendChild(s);
    }
</script>
</body>
</html>
