<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Uploader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        .drop-zones-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }
        .drop-zone {
            flex: 1;
            min-width: 250px;
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px 20px;
            background-color: #f0f8ff;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .drop-zone.dragover {
            background-color: #e1f0fa;
            border-color: #2980b9;
            transform: scale(1.02);
        }
        .file-input {
            display: none;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
        .info { color: #3498db; }

        .menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #555;
            z-index: 1000;
        }

        .pat-container {
            display: none;
            position: absolute;
            top: 60px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 0.9em;
            color: #666;
            z-index: 999;
            width: 300px;
            text-align: left;
            border: 1px solid #ddd;
        }
        .pat-container.show {
            display: block;
        }
        #pat-input {
            padding: 8px;
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .drive-btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 30px;
            transition: background-color 0.3s;
        }
        .drive-btn:hover {
            background-color: #219a52;
        }
    </style>
</head>
<body>

<button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>

<div class="pat-container" id="pat-menu">
    <h3 style="margin-top: 0; color: #333;">Configuration</h3>
    <p style="margin-bottom: 15px;">Requires GitHub Personal Access Token (PAT) for backend processing.</p>
    <input type="password" id="pat-input" placeholder="Enter GitHub PAT">
    <button class="btn" style="width: 100%; font-size: 14px;" onclick="savePAT()">Save PAT</button>
</div>

<div class="container">
    <h1>Upload to Google Drive</h1>
    <p>Select the folder you want to upload your files to.</p>

    <div class="drop-zones-wrapper">
        <div class="drop-zone" data-folder="1MVeC2j0v4zTA1sVjhLz06bqEz3qbaYxs">
            <h3 class="folder-name">Loading folder name...</h3>
            <p>Drop file here or click to browse</p>
            <input type="file" class="file-input">
        </div>

        <div class="drop-zone" data-folder="1KI_KifGRzRnafb5Z0IuXmdrgIEyB5_3f">
            <h3 class="folder-name">Loading folder name...</h3>
            <p>Drop file here or click to browse</p>
            <input type="file" class="file-input">
        </div>
    </div>

    <div id="status"></div>

    <a href="https://drive.google.com/drive/folders/1y42Dh7ZSNXWRA9e-ffU9bqkQlF1T4g4x?usp=share_link" target="_blank" class="drive-btn">
        Open in Google Drive
    </a>
</div>

<script>
    const REPO = 'cju-media/tech-info';
    const statusDiv = document.getElementById('status');
    const menuBtn = document.getElementById('menu-btn');
    const patMenu = document.getElementById('pat-menu');
    const patInput = document.getElementById('pat-input');
    const dropZones = document.querySelectorAll('.drop-zone');

    // Fetch folder names on init with cache busting
    fetch(`folder_names.json?t=${new Date().getTime()}`)
        .then(response => {
            if (!response.ok) throw new Error("JSON not available");
            return response.json();
        })
        .then(data => {
            dropZones.forEach(zone => {
                const folderId = zone.getAttribute('data-folder');
                if (data[folderId]) {
                    zone.querySelector('.folder-name').textContent = data[folderId];
                } else {
                    zone.querySelector('.folder-name').textContent = "Unknown Folder";
                }
            });
        })
        .catch(err => {
            console.warn("Could not fetch folder names:", err);
            dropZones.forEach(zone => {
                zone.querySelector('.folder-name').textContent = "Google Drive Folder";
            });
        });

    // Load PAT on init
    const savedPat = localStorage.getItem('GITHUB_PAT');
    if (savedPat) {
        patInput.value = savedPat;
    }

    // Menu toggle
    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        patMenu.classList.toggle('show');
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
        if (!patMenu.contains(e.target) && e.target !== menuBtn) {
            patMenu.classList.remove('show');
        }
    });

    function savePAT() {
        const pat = patInput.value.trim();
        if (pat) {
            localStorage.setItem('GITHUB_PAT', pat);
            setStatus('PAT saved successfully!', 'success');
            patMenu.classList.remove('show');
        } else {
            localStorage.removeItem('GITHUB_PAT');
            setStatus('PAT removed.', 'info');
            patMenu.classList.remove('show');
        }
    }

    function setStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = type;
    }

    // Attach events to all drop zones
    dropZones.forEach(zone => {
        const fileInput = zone.querySelector('.file-input');
        const targetFolder = zone.getAttribute('data-folder');

        zone.addEventListener('dragover', (e) => {
            e.preventDefault();
            zone.classList.add('dragover');
        });

        zone.addEventListener('dragleave', () => {
            zone.classList.remove('dragover');
        });

        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0], targetFolder, fileInput);
            }
        });

        // Clicking anywhere in the zone triggers the hidden file input
        zone.addEventListener('click', (e) => {
            if (e.target !== fileInput) {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                handleFile(fileInput.files[0], targetFolder, fileInput);
            }
        });
    });

    async function handleFile(file, targetFolder, inputElement) {
        const pat = localStorage.getItem('GITHUB_PAT');
        if (!pat) {
            setStatus('Error: GitHub PAT is required. Please enter it below.', 'error');
            return;
        }

        setStatus(`Reading ${file.name}...`, 'info');

        const reader = new FileReader();
        reader.onload = async (e) => {
            const dataUrl = e.target.result;
            // Extract the Base64 content from the Data URL
            const base64String = dataUrl.split(',')[1];
            await uploadToGithub(file.name, base64String, pat, targetFolder, inputElement);
        };
        reader.onerror = () => setStatus('Error reading file.', 'error');
        reader.readAsDataURL(file);
    }

    async function uploadToGithub(filename, base64Content, pat, targetFolder, inputElement) {
        setStatus(`Uploading ${filename} to processing queue...`, 'info');

        // Use a timestamp to ensure uniqueness and prevent conflicts
        const safeFilename = filename.replace(/[^a-zA-Z0-9.-]/g, '_');
        // Format: TIMESTAMP_FOLDERID_FILENAME
        const path = `uploads_queue/${Date.now()}_${targetFolder}_${safeFilename}`;

        const payload = {
            message: `Upload ${filename} to Drive via web UI`,
            content: base64Content
        };

        try {
            const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${pat}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.message || response.statusText);
            }

            setStatus('File queued successfully! It will appear in Google Drive shortly.', 'success');
            inputElement.value = ''; // Reset input
        } catch (error) {
            console.error(error);
            if (error.message.includes('Bad credentials')) {
                setStatus('Error: Invalid GitHub PAT.', 'error');
            } else {
                setStatus(`Upload failed: ${error.message}`, 'error');
            }
        }
    }
</script>

</body>
</html>
