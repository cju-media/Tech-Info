<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Uploader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        #drop-zone {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 50px 20px;
            margin: 20px 0;
            background-color: #f0f8ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        #drop-zone.dragover {
            background-color: #e1f0fa;
            border-color: #2980b9;
            transform: scale(1.02);
        }
        #file-input {
            display: none;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
        .info { color: #3498db; }

        .pat-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9em;
            color: #666;
        }
        #pat-input {
            padding: 8px;
            width: 80%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Upload to Google Drive</h1>
    <p>Drag and drop a file below, or click to select.</p>

    <div id="drop-zone">
        <h3>Drop file here</h3>
        <p>or click to browse</p>
    </div>
    <input type="file" id="file-input">

    <div id="status"></div>

    <div class="pat-container">
        <p>Requires GitHub Personal Access Token (PAT) for backend processing.</p>
        <input type="password" id="pat-input" placeholder="Enter GitHub PAT (saved to localStorage)">
        <br>
        <button class="btn" style="font-size: 14px; padding: 6px 12px;" onclick="savePAT()">Save PAT</button>
    </div>
</div>

<script>
    const REPO = 'cju-media/tech-info'; // Standardize to tech-info
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const statusDiv = document.getElementById('status');
    const patInput = document.getElementById('pat-input');

    // Load PAT on init
    const savedPat = localStorage.getItem('GITHUB_PAT');
    if (savedPat) {
        patInput.value = savedPat;
    }

    function savePAT() {
        const pat = patInput.value.trim();
        if (pat) {
            localStorage.setItem('GITHUB_PAT', pat);
            setStatus('PAT saved successfully!', 'success');
        } else {
            localStorage.removeItem('GITHUB_PAT');
            setStatus('PAT removed.', 'info');
        }
    }

    function setStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = type;
    }

    // Drag and Drop Events
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    // Click Event
    dropZone.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
            handleFile(fileInput.files[0]);
        }
    });

    async function handleFile(file) {
        const pat = localStorage.getItem('GITHUB_PAT');
        if (!pat) {
            setStatus('Error: GitHub PAT is required. Please enter it below.', 'error');
            return;
        }

        setStatus(`Reading ${file.name}...`, 'info');

        const reader = new FileReader();
        reader.onload = async (e) => {
            const dataUrl = e.target.result;
            // Extract the Base64 content from the Data URL
            const base64String = dataUrl.split(',')[1];
            await uploadToGithub(file.name, base64String, pat);
        };
        reader.onerror = () => setStatus('Error reading file.', 'error');
        reader.readAsDataURL(file);
    }

    async function uploadToGithub(filename, base64Content, pat) {
        setStatus(`Uploading ${filename} to processing queue...`, 'info');

        // Use a timestamp to ensure uniqueness and prevent conflicts
        const safeFilename = filename.replace(/[^a-zA-Z0-9.-]/g, '_');
        const path = `uploads_queue/${Date.now()}_${safeFilename}`;

        const payload = {
            message: `Upload ${filename} via web UI`,
            content: base64Content
        };

        try {
            const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${pat}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.message || response.statusText);
            }

            setStatus('File queued successfully! It will appear in Google Drive shortly.', 'success');
            fileInput.value = ''; // Reset
        } catch (error) {
            console.error(error);
            if (error.message.includes('Bad credentials')) {
                setStatus('Error: Invalid GitHub PAT.', 'error');
            } else {
                setStatus(`Upload failed: ${error.message}`, 'error');
            }
        }
    }
</script>

</body>
</html>
