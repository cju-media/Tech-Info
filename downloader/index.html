<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Downloader</title>
    <link rel="stylesheet" href="styles.css">
    <!-- JSZip for zipping files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <button class="menu-btn" id="menu-btn" aria-label="Menu">⚙️</button>

    <div class="api-key-container" id="api-key-menu">
        <h3>Configuration</h3>
        <p>Requires Google API Key with Drive API enabled.</p>
        <input type="password" id="api-key-input" placeholder="Enter Google API Key">
        <button class="btn" onclick="saveApiKey()">Save API Key</button>
    </div>

    <div class="container">
        <h1>Google Drive Downloader</h1>

        <div class="input-section">
            <input type="text" id="folder-url-input" placeholder="Paste Google Drive Folder URL here">
            <button class="btn primary" id="load-folder-btn">Load Folder</button>
        </div>

        <div id="status"></div>

        <div class="main-content">
            <div class="browser-section">
                <div class="breadcrumbs" id="breadcrumbs">
                    <!-- Breadcrumbs will be populated here -->
                </div>

                <div class="file-list-header">
                    <input type="checkbox" id="select-all-checkbox">
                    <span>Select All</span>
                </div>

                <ul class="file-list" id="file-list">
                    <!-- Files and folders will be listed here -->
                </ul>
            </div>

            <div class="cart-section">
                <h2>Download Cart</h2>
                <ul class="cart-list" id="cart-list">
                    <!-- Cart items will be listed here -->
                </ul>
                <div class="cart-actions">
                    <button class="btn success" id="checkout-btn" disabled>Download Selected (<span id="cart-count">0</span>)</button>
                </div>
                <div id="download-progress" class="progress-bar-container" style="display: none;">
                    <div class="progress-bar" id="progress-bar-fill"></div>
                    <div class="progress-text" id="progress-text">0%</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
