<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Workflows Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            color: #333;
        }
        h1, h2 {
            text-align: center;
        }
        .dashboard-table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 40px;
        }
        .dashboard-table th, .dashboard-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .dashboard-table th {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .dashboard-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .dashboard-table tr:hover {
            background-color: #f1f1f1;
        }
        .success { color: green; font-weight: bold; }
        .failure { color: red; font-weight: bold; }
        .loading { text-align: center; padding: 20px; font-style: italic; }

        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Tech-Info Automated Workflows</h1>

    <h2>Latest Workflow Runs</h2>
    <table class="dashboard-table" id="workflowsTable">
        <thead>
            <tr>
                <th>Workflow</th>
                <th>Status</th>
                <th>Last Run Time</th>
                <th>Trigger</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody id="workflowsBody">
            <tr><td colspan="5" class="loading">Loading workflow data...</td></tr>
        </tbody>
    </table>

    <h2>Recent File Changes</h2>
    <table class="dashboard-table" id="commitsTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Message</th>
                <th>Files Processed</th>
            </tr>
        </thead>
        <tbody id="commitsBody">
            <tr><td colspan="3" class="loading">Loading commit data...</td></tr>
        </tbody>
    </table>

    <script>
        const REPO = 'cju-media/Tech-Info';

        async function loadWorkflows() {
            try {
                // Fetch workflows
                const wfResponse = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows`);
                const wfData = await wfResponse.json();
                const workflows = wfData.workflows;

                // Fetch recent runs
                const runsResponse = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=50`);
                const runsData = await runsResponse.json();

                const latestRuns = {};
                for (const run of runsData.workflow_runs) {
                    if (!latestRuns[run.workflow_id]) {
                        latestRuns[run.workflow_id] = run;
                    }
                }

                const tbody = document.getElementById('workflowsBody');
                tbody.innerHTML = '';

                for (const wf of workflows) {
                    const run = latestRuns[wf.id];
                    const tr = document.createElement('tr');

                    const nameTd = document.createElement('td');
                    nameTd.textContent = wf.name;
                    tr.appendChild(nameTd);

                    const statusTd = document.createElement('td');
                    if (run) {
                        const status = run.conclusion || run.status;
                        statusTd.textContent = status.charAt(0).toUpperCase() + status.slice(1);
                        statusTd.className = run.conclusion === 'success' ? 'success' : (run.conclusion === 'failure' ? 'failure' : '');
                    } else {
                        statusTd.textContent = 'N/A';
                    }
                    tr.appendChild(statusTd);

                    const timeTd = document.createElement('td');
                    timeTd.textContent = run ? new Date(run.updated_at).toLocaleString() : 'N/A';
                    tr.appendChild(timeTd);

                    const triggerTd = document.createElement('td');
                    triggerTd.textContent = run ? run.event : 'N/A';
                    tr.appendChild(triggerTd);

                    const detailsTd = document.createElement('td');
                    if (run) {
                        const a = document.createElement('a');
                        a.href = run.html_url;
                        a.textContent = 'View Run';
                        a.target = '_blank';
                        detailsTd.appendChild(a);
                    } else {
                        detailsTd.textContent = '-';
                    }
                    tr.appendChild(detailsTd);

                    tbody.appendChild(tr);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('workflowsBody').innerHTML = '<tr><td colspan="5" class="failure">Error loading workflows.</td></tr>';
            }
        }

        async function loadCommits() {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=15`);
                const commits = await response.json();

                const tbody = document.getElementById('commitsBody');
                tbody.innerHTML = '';

                for (const commit of commits) {
                    const tr = document.createElement('tr');

                    const dateTd = document.createElement('td');
                    dateTd.textContent = new Date(commit.commit.author.date).toLocaleString();
                    tr.appendChild(dateTd);

                    const msgTd = document.createElement('td');
                    const msgA = document.createElement('a');
                    msgA.href = commit.html_url;
                    msgA.target = "_blank";
                    msgA.textContent = commit.commit.message.split('\n')[0]; // Only show first line
                    msgTd.appendChild(msgA);
                    tr.appendChild(msgTd);

                    const filesTd = document.createElement('td');
                    filesTd.textContent = 'Loading...';
                    tr.appendChild(filesTd);
                    tbody.appendChild(tr);

                    // Fetch individual commit to get files
                    fetch(commit.url).then(res => res.json()).then(data => {
                        if (data.files && data.files.length > 0) {
                            const fileNames = data.files.map(f => f.filename).join(', ');
                            filesTd.textContent = fileNames;
                        } else {
                            filesTd.textContent = 'None';
                        }
                    }).catch(() => {
                        filesTd.textContent = 'Failed to load files';
                    });
                }
            } catch (err) {
                console.error(err);
                document.getElementById('commitsBody').innerHTML = '<tr><td colspan="3" class="failure">Error loading commits.</td></tr>';
            }
        }

        loadWorkflows();
        loadCommits();
    </script>
</body>
</html>
