<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Overrides Editor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 100px; }
        button { padding: 10px 15px; background-color: #0056b3; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #004494; }
        .status { margin-top: 15px; padding: 10px; display: none; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        #auth-section { background-color: #f1f1f1; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .date-input { display: flex; gap: 10px; }
        .date-input > div { flex: 1; }
    </style>
</head>
<body>
    <h1>Edit Event Overrides</h1>

    <div id="auth-section">
        <h3>GitHub Authentication</h3>
        <p>To save changes, you must provide a GitHub Personal Access Token (PAT) with `repo` access to this repository.</p>
        <div class="form-group">
            <label for="github-token">GitHub Token:</label>
            <input type="password" id="github-token" placeholder="ghp_...">
        </div>
        <div class="form-group">
            <label for="repo-path">Repository (owner/repo):</label>
            <input type="text" id="repo-path" value="cju-media/Tech-Info" placeholder="owner/repo"> <!-- Defaulting, user can change -->
        </div>
    </div>

    <div class="form-group">
        <label for="event-date">Event Date (YYYY-MM-DD):</label>
        <input type="date" id="event-date">
        <small>Select the date of the event you want to override.</small>
    </div>

    <div class="form-group">
        <button id="load-btn" type="button">Load Existing Overrides for Date</button>
    </div>

    <hr>

    <h3>Overrides</h3>
    <p>Leave fields blank to use the automated system defaults.</p>

    <div class="form-group">
        <label for="override-notes">Notes (Communion, General info, etc.):</label>
        <textarea id="override-notes" placeholder="Enter notes..."></textarea>
    </div>

    <div class="form-group">
        <label for="override-rf">RF Coordination Warnings:</label>
        <textarea id="override-rf" placeholder="Enter RF warnings..."></textarea>
    </div>

    <div class="form-group">
        <label for="override-mic">Mic Info (Speaker Info, etc.):</label>
        <textarea id="override-mic" placeholder="Enter mic/speaker info..."></textarea>
    </div>

    <div class="form-group">
        <button id="save-btn" type="button">Save Overrides to GitHub</button>
    </div>

    <div id="status-message" class="status"></div>

    <script>
        const REPO_FILE_PATH = 'manual_overrides.json';
        let currentSha = null;
        let allOverrides = {};

        function showStatus(message, isError = false) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            statusDiv.className = 'status ' + (isError ? 'error' : 'success');
        }

        async function fetchOverrides() {
            const token = document.getElementById('github-token').value;
            const repo = document.getElementById('repo-path').value;
            if (!repo) {
                showStatus('Repository path is required.', true);
                return;
            }

            const headers = {
                'Accept': 'application/vnd.github.v3+json'
            };
            if (token) {
                headers['Authorization'] = `token ${token}`;
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${REPO_FILE_PATH}`, { headers });

                if (response.status === 404) {
                    allOverrides = {};
                    currentSha = null;
                    return;
                }

                if (!response.ok) {
                    throw new Error(`Failed to fetch file: ${response.statusText}`);
                }

                const data = await response.json();
                currentSha = data.sha;

                // Content is base64 encoded
                const content = atob(data.content);
                allOverrides = JSON.parse(content);
            } catch (error) {
                console.error("Error fetching overrides:", error);
                showStatus(`Error loading overrides: ${error.message}`, true);
                allOverrides = {};
            }
        }

        document.getElementById('load-btn').addEventListener('click', async () => {
            const dateInput = document.getElementById('event-date').value;
            if (!dateInput) {
                showStatus('Please select a date first.', true);
                return;
            }

            await fetchOverrides();

            const dateOverrides = allOverrides[dateInput] || {};
            document.getElementById('override-notes').value = dateOverrides.notes || '';
            document.getElementById('override-rf').value = dateOverrides.rfWarnings || '';
            document.getElementById('override-mic').value = dateOverrides.micInfo || '';

            showStatus(`Loaded overrides for ${dateInput}.`);
        });

        document.getElementById('save-btn').addEventListener('click', async () => {
            const token = document.getElementById('github-token').value;
            const repo = document.getElementById('repo-path').value;
            const dateInput = document.getElementById('event-date').value;

            if (!token) {
                showStatus('GitHub Token is required to save.', true);
                return;
            }
            if (!repo) {
                showStatus('Repository path is required.', true);
                return;
            }
            if (!dateInput) {
                showStatus('Please select a date before saving.', true);
                return;
            }

            // Ensure we have the latest SHA before saving to avoid conflicts
            await fetchOverrides();

            const notes = document.getElementById('override-notes').value.trim();
            const rfWarnings = document.getElementById('override-rf').value.trim();
            const micInfo = document.getElementById('override-mic').value.trim();

            if (!allOverrides[dateInput]) {
                allOverrides[dateInput] = {};
            }

            allOverrides[dateInput].notes = notes || null;
            allOverrides[dateInput].rfWarnings = rfWarnings || null;
            allOverrides[dateInput].micInfo = micInfo || null;

            // Clean up nulls
            if (!notes) delete allOverrides[dateInput].notes;
            if (!rfWarnings) delete allOverrides[dateInput].rfWarnings;
            if (!micInfo) delete allOverrides[dateInput].micInfo;

            // Clean up empty dates
            if (Object.keys(allOverrides[dateInput]).length === 0) {
                delete allOverrides[dateInput];
            }

            const newContent = JSON.stringify(allOverrides, null, 2);

            // btoa expects a string in Latin-1. To handle utf-8 safely:
            const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

            const body = {
                message: `Update manual overrides for ${dateInput}`,
                content: encodedContent
            };

            if (currentSha) {
                body.sha = currentSha;
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${REPO_FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(`Failed to save: ${errData.message}`);
                }

                const data = await response.json();
                currentSha = data.content.sha; // Update SHA for subsequent saves

                showStatus(`Successfully saved overrides for ${dateInput}! It may take a minute for the main site to update.`);
            } catch (error) {
                console.error("Error saving:", error);
                showStatus(`Error saving overrides: ${error.message}`, true);
            }
        });
    </script>
</body>
</html>
