name: Check Worship Scripts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth python-dateutil requests

      - name: Run script checker
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python update_worship_scripts.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add worship_scripts.json service-scripts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update worship scripts JSON" && git push)
