name: Service Titles Checker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force Gemini processing for upcoming scripts'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-service-titles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf google-genai google-api-python-client google-auth

      - name: Run update service titles script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: cd "Worship Scripts" && python update_service_titles.py

      - name: Trigger Notification
        if: success()
        run: |
          if [ -f "Worship Scripts/.sync_success" ]; then
            echo "Triggering macOS notification workflow..."
            curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT }}" \
            -d '{"event_type": "drive_upload_complete"}'
            rm "Worship Scripts/.sync_success"
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch "Worship Scripts/service_titles_state.json"
          git add "Worship Scripts/service-titles/" "Worship Scripts/service_titles_state.json"
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update service titles" && git pull --rebase origin main && git push)
