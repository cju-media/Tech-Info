name: Check Schedule Updates

on:
  schedule:
    # Run 3 hours earlier to account for GitHub Actions delay queue
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: [self-hosted, macOS]

    # Add permissions needed to push the updated state.json back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for WeasyPrint
        run: |
          brew install pango || true

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas weasyprint

      - name: Run schedule script in Update Mode
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          DRY_RUN: '0'
          RUN_MODE: 'update'
        run: cd "Scheduling/Event Data" && python3 send_weekly_schedule.py

      - name: Commit and push state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "Scheduling/Event Data/state.json"
          # Only commit and push if state.json has changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update schedule state" && git push)
