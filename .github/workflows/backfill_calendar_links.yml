name: Backfill Calendar Links

on:
  schedule:
    - cron: '15 9 * * *'  # Daily at 9:15 UTC, just after Mark Past Schedule Events
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log the planned links, do not write the sheet)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  backfill-calendar-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Write dashboard links into the schedule sheet
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && '1' || '0' }}
        run: cd "Utilities/Scheduling/Event Data" && python backfill_calendar_links.py
