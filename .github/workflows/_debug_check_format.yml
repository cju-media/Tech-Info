name: DEBUG Check Sheet Formatting

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Check formatting for row 84 (all columns) and conditional formats
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'EOF'
          import os, json
          from googleapiclient.discovery import build
          from google.oauth2 import service_account

          creds_dict = json.loads(os.environ['GDRIVE_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              creds_dict, scopes=['https://www.googleapis.com/auth/spreadsheets.readonly']
          )
          service = build('sheets', 'v4', credentials=creds)

          resp = service.spreadsheets().get(
              spreadsheetId='1UC8vgy89W14bVEWROqdUc9VgkMTGykC5ZZJqSDmi2-A',
              ranges=['Tech Availability!A84:K84'],
              fields='sheets(data(rowData(values(userEnteredFormat(textFormat),effectiveFormat(textFormat),formattedValue))),conditionalFormats)',
              includeGridData=True
          ).execute()

          sheet = resp['sheets'][0]
          row_data = sheet['data'][0].get('rowData', [])
          values = row_data[0].get('values', []) if row_data else []
          print("--- Row 84, all columns ---")
          for i, cell in enumerate(values):
              col = chr(ord('A') + i)
              uf_tf = cell.get('userEnteredFormat', {}).get('textFormat', {})
              ef_tf = cell.get('effectiveFormat', {}).get('textFormat', {})
              print(col, repr(cell.get('formattedValue')),
                    'userEntered strike/color=', uf_tf.get('strikethrough'), uf_tf.get('foregroundColor'),
                    '| effective strike/color=', ef_tf.get('strikethrough'), ef_tf.get('foregroundColor'))

          print("--- Conditional formats on this sheet ---")
          cf = sheet.get('conditionalFormats', [])
          print(json.dumps(cf, indent=2)[:6000])
          EOF
