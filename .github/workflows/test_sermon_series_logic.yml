name: Test Worship Workflow Logic

# Fast, dependency-free unit tests for the pure decision logic in the worship
# workflow scripts:
#  - create_sermon_series.py: "which Sunday is this run about" (the guard that
#    broke on 2026-08-30 when an Order of Worship was processed Sunday morning).
#  - cleanup_events_folder.py: the misread-year check that stops bogus
#    "delete this flyer" alerts (fired four times on 2026-08-31).

on:
  push:
    paths:
      - 'Worship Scripts/worship workflows/create_sermon_series.py'
      - 'Worship Scripts/worship workflows/test_create_sermon_series.py'
      - 'Worship Scripts/worship workflows/cleanup_events_folder.py'
      - 'Worship Scripts/worship workflows/test_cleanup_events_folder.py'
      - '.github/workflows/test_sermon_series_logic.yml'
  pull_request:
    paths:
      - 'Worship Scripts/worship workflows/create_sermon_series.py'
      - 'Worship Scripts/worship workflows/test_create_sermon_series.py'
      - 'Worship Scripts/worship workflows/cleanup_events_folder.py'
      - 'Worship Scripts/worship workflows/test_cleanup_events_folder.py'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run unit tests
        run: cd "Worship Scripts/worship workflows" && python -m unittest test_create_sermon_series test_cleanup_events_folder -v
