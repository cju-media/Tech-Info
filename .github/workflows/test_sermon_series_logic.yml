name: Test Worship Workflow Logic

# Fast, dependency-free unit tests for the pure decision logic in the worship
# workflow scripts:
#  - create_sermon_series.py: "which Sunday is this run about" (the guard that
#    broke on 2026-08-30 when an Order of Worship was processed Sunday morning).
#  - cleanup_events_folder.py: the misread-year check that stops bogus
#    "delete this flyer" alerts (fired four times on 2026-08-31).
#  - upload_queue_to_drive.py: the {"replace": true} sidecar a changed title-graphics
#    pick sends (overwrite in Drive, re-upload the stream thumbnail).
#  - service_keys.py and the per-service pipeline: several services on one date
#    (Christmas Eve), each with its own OW, stream, titles and timings.

on:
  push:
    # Dashboard video batches; handled by upload_display_videos.yml.
    branches-ignore: ['video-upload/**']
    paths:
      - 'Worship Scripts/worship workflows/create_sermon_series.py'
      - 'Worship Scripts/worship workflows/test_create_sermon_series.py'
      - 'Worship Scripts/worship workflows/cleanup_events_folder.py'
      - 'Worship Scripts/worship workflows/test_cleanup_events_folder.py'
      - 'Worship Scripts/worship workflows/upload_queue_to_drive.py'
      - 'Worship Scripts/worship workflows/test_upload_queue_replace.py'
      - 'Worship Scripts/worship workflows/service_keys.py'
      - 'Worship Scripts/worship workflows/test_service_keys.py'
      - 'Worship Scripts/worship workflows/update_service_titles.py'
      - 'Youtube Processing/*.py'
      - '.github/workflows/test_sermon_series_logic.yml'
  pull_request:
    paths:
      - 'Worship Scripts/worship workflows/create_sermon_series.py'
      - 'Worship Scripts/worship workflows/test_create_sermon_series.py'
      - 'Worship Scripts/worship workflows/cleanup_events_folder.py'
      - 'Worship Scripts/worship workflows/test_cleanup_events_folder.py'
      - 'Worship Scripts/worship workflows/upload_queue_to_drive.py'
      - 'Worship Scripts/worship workflows/test_upload_queue_replace.py'
      - 'Worship Scripts/worship workflows/service_keys.py'
      - 'Worship Scripts/worship workflows/test_service_keys.py'
      - 'Worship Scripts/worship workflows/update_service_titles.py'
      - 'Youtube Processing/*.py'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # test_service_keys walks Christmas Eve's three services through the
      # per-service pipeline (create/update stream, description); those scripts
      # need these two.
      - name: Install dependencies
        run: pip install python-dateutil pytz

      - name: Run unit tests
        run: cd "Worship Scripts/worship workflows" && python -m unittest test_create_sermon_series test_cleanup_events_folder test_upload_queue_replace test_service_keys -v
