name: Cleanup Events Folder

on:
  schedule:
    - cron: '15 9 * * *'  # Daily at 9:15 UTC (~1-2 AM Pacific)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, do not trash files or notify)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  cleanup-events-folder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client google-genai requests

      - name: Move past-dated event flyers to Trash
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && '1' || '0' }}
        run: python "Worship Scripts/worship workflows/cleanup_events_folder.py"

      - name: Commit notified-file state
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "Worship Scripts/worship workflows/events_cleanup_notified_ids.json" || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update events cleanup notified-file state" && git pull --rebase origin ${{ github.ref_name }} && git push)
