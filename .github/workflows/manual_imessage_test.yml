name: Test iMessage Runner

on:
  workflow_dispatch:

jobs:
  test-imessage:
    runs-on: [self-hosted, macOS]
    env:
      RUNNER_TOOL_CACHE: /tmp/runner_tool_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies for WeasyPrint
        run: |
          brew install pango

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas weasyprint

      - name: Run script in iMessage Test Mode
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          DRY_RUN: '0'
          RUN_MODE: 'imessage_test'
        run: python send_weekly_schedule.py
