name: Test Worship Scripts Sync

on:
  workflow_dispatch:

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth python-dateutil requests pypdf

      - name: Run test script
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: cd "Worship Scripts" && python "worship workflows/test_worship_scripts.py"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "Worship Scripts/service-scripts/" || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Run test worship scripts sync" && git push)
