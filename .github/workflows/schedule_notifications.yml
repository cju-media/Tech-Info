name: Schedule and Notifications

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour at minute 0
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - weekly
          - admin
          - update
          - avail_check
          - daily_reminder
          - test
        # Note: imessage_reminder/imessage_test are intentionally not offered here.
        # This workflow runs on ubuntu-latest, which has no Messages app/osascript;
        # those modes only work in "iMessage Notifications" (self-hosted macOS).

jobs:
  run-schedule:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas weasyprint

      - name: Run unified schedule script
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          DRY_RUN: '0'
          RUN_MODE: ${{ github.event.inputs.run_mode || 'auto' }}
        run: cd "Scheduling/Event Data" && python3 send_weekly_schedule.py

      - name: Commit and push state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Add any state files that may have changed
          git add "Scheduling/Event Data/state.json" || true
          git add "Scheduling/Event Data/avail_state.json" || true

          # Only commit and push if state files have changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update schedule states" && git pull --rebase origin ${{ github.ref_name }} && git push)
