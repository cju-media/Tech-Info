name: Sync Service Titles to Drive

on:
  push:
    paths:
      - 'Worship Scripts/service-titles/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-to-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Run sync script
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: cd "Worship Scripts" && python sync_service_titles_to_drive.py

      - name: Trigger Notification
        if: success()
        run: |
          if [ -f "Worship Scripts/.sync_success" ]; then
            echo "Triggering macOS notification workflow..."
            curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT }}" \
            -d '{"event_type": "drive_upload_complete"}'
            rm "Worship Scripts/.sync_success"
          fi
