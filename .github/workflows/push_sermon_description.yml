name: Push Sermon Description

# migrate_videos.py stamps a sermon video's description once, at upload time.
# When the "SS Description-<date>.txt" file was still carrying the
# YOUTUBE SERVICE LINK placeholder at that moment, correcting the file
# afterwards (via "Backfill Sermon Series Stream Link") fixes git and Drive
# but not the video that already went public. Run this after that backfill to
# put the corrected text on the video itself.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Service date in MM-DD-YYYY format'
        required: true
      video_id:
        description: 'Optional: YouTube video id (defaults to last_upload.json for that date)'
        required: false

jobs:
  push-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Push description
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: |
          python "Utilities/Video Migration/push_sermon_description.py" \
            "${{ github.event.inputs.date }}" \
            ${{ github.event.inputs.video_id && format('--video-id {0}', github.event.inputs.video_id) || '' }}
