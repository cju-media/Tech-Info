name: Generate Sermon Series File

on:
  push:
    paths:
      - 'Worship Scripts/service-titles/sermon-title.txt'
      - 'Worship Scripts/service-titles/sermon-minister.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 python-dateutil pytz

      - name: Run sermon series script
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: cd "Worship Scripts" && python create_sermon_series.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "Worship Scripts/Sermon-Series/"
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Generate new Sermon Series text file" && git pull --rebase origin ${{ github.ref_name }} && git push)
