name: Video Migration

on:
  schedule:
    # Run every Monday at 9:00 AM Pacific Time (16:00 UTC, or 17:00 UTC depending on DST)
    # Using 17:00 UTC to safely align around Monday morning PT.
    - cron: '0 17 * * 1'
  workflow_dispatch:
    inputs:
      privacy_status:
        description: 'YouTube Video Privacy Status'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - public

jobs:
  migrate_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-oauthlib pytz

      - name: Run video migration script
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'private' }}
        run: |
          python "Video Migration/migrate_videos.py"
