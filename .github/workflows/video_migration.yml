name: Video Migration

on:
  schedule:
    # Run every Monday at 9:00 AM Pacific Time (16:00 UTC, or 17:00 UTC depending on DST)
    # Using 17:00 UTC to safely align around Monday morning PT.
    - cron: '0 17 * * 1'
  workflow_dispatch:
    inputs:
      privacy_status:
        description: 'YouTube Video Privacy Status'
        required: true
        default: 'public'
        type: choice
        options:
          - private
          - public
      service_date:
        description: 'Service date MM-DD-YYYY (default: the last Sunday before today)'
        required: false
        default: ''
        type: string
      test_run:
        description: 'Test run: upload a private [TEST] copy even if already uploaded; skip playlist and breadcrumb'
        required: false
        default: false
        type: boolean

jobs:
  migrate_video:
    # Self-hosted: YouTube bot-checks the livestream audio download from
    # GitHub's datacenter IPs ("Sign in to confirm you're not a bot").
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet --upgrade google-api-python-client google-auth google-auth-oauthlib pytz requests
          command -v ffmpeg >/dev/null || brew install ffmpeg
          # The runner's system Python is 3.9, which pip can only give a stale
          # yt-dlp (current releases need 3.10+; stale ones fail with "The page
          # needs to be reloaded"). The official standalone build bundles its own.
          curl -fsSL -o "$RUNNER_TEMP/yt-dlp" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x "$RUNNER_TEMP/yt-dlp"
          "$RUNNER_TEMP/yt-dlp" --version
          echo "YT_DLP=$RUNNER_TEMP/yt-dlp" >> "$GITHUB_ENV"
          # yt-dlp needs a JavaScript runtime to solve YouTube's player challenge.
          command -v deno >/dev/null || command -v node >/dev/null || brew install deno

      - name: Run video migration script
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          # Optional Netscape-format cookies.txt for yt-dlp; YouTube often
          # bot-checks the livestream audio download from GitHub's runners.
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'public' }}
          SERVICE_DATE: ${{ github.event.inputs.service_date }}
          SERMON_TEST_RUN: ${{ github.event.inputs.test_run == 'true' && '1' || '' }}
          PAT: ${{ secrets.PAT }}
        run: |
          python3 "Utilities/Video Migration/migrate_videos.py"

      - name: Commit last-upload breadcrumb
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Written by migrate_videos.py only on a successful YouTube upload;
          # the tech-info dashboard's pipeline section reads it.
          git add "Utilities/Video Migration/last_upload.json" || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Record last sermon video migration" && git pull --rebase origin main && git push)
