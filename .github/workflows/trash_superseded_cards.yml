name: Trash Superseded Cards (one-off)

# One-off cleanup for the 2026-09-19 multi-copy change. Delete this workflow
# and Utilities/trash_superseded_cards.py once it has run successfully.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list what would be trashed)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  trash-superseded-cards:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth requests
      - name: Trash the superseded cards
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python Utilities/trash_superseded_cards.py
