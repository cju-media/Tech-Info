name: Sync Calendar Notes

on:
  schedule:
    - cron: '30 9 * * *'  # Daily at 9:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log the plan and matches, write nothing)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  sync-calendar-notes:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth

      - name: Pull calendar notes into the schedule sheet
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cd "Utilities/Scheduling/Event Data" && python sync_calendar_notes.py

      - name: Commit the match cache
        if: ${{ env.DRY_RUN == '0' }}
        run: |
          state="Utilities/Scheduling/Event Data/calendar_notes_state.json"
          if ! git diff --quiet -- "$state"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$state"
            git commit -m "chore: Update calendar notes match cache"
            git push
          fi
