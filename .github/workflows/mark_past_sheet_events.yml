name: Mark Past Schedule Events

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9:00 UTC (~1-2 AM Pacific)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no sheet changes)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  mark-past-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth python-dateutil

      - name: Mark past events on the schedule sheet
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && '1' || '0' }}
        run: cd "Utilities/Scheduling/Event Data" && python mark_past_events.py
