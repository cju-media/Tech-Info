name: Audit Newsletter Card

# Confirms the Meetinghouse card on the screens isn't advertising anything
# that has already happened.
#
# The generator drops past items on every run, so this deliberately does not
# re-run that filter -- it would be the same code over the same data,
# agreeing with itself. It checks the two things the generator can't check
# about itself: the date as the card visibly states it (an item can carry
# "Saturday, Sept 26" in its text with no machine-readable date behind it,
# and nothing expires that), and whether the card in Drive is the one the
# generator last published at all.
#
# It reports and texts; it doesn't fix. The fix is a generator run, which
# already happens hourly, so a card still wrong at audit time means those
# runs aren't working and re-triggering them would hide that.
#
# 16:20 UTC is about 9:20am Pacific -- after the overnight runs have had all
# night to correct the card, and early enough that a text lands before the
# building fills up.

on:
  schedule:
    - cron: '20 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report, but send no text)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: audit-newsletter-card
  cancel-in-progress: false

jobs:
  audit-newsletter-card:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Drive, to compare what's in the folder against what the generator
          # recorded publishing. segno is pulled in by the module this
          # imports its state helpers from.
          pip install google-api-python-client google-auth requests segno

      - name: Run audit tests
        run: cd "Utilities/Newsletter Ad" && python -m unittest test_audit_newsletter_card -v

      - name: Audit the card
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          # Fires the repository_dispatch that imessage_notifications.yml
          # turns into a text. This job runs on ubuntu and can't send one.
          PAT: ${{ secrets.PAT }}
        run: cd "Utilities/Newsletter Ad" && python audit_newsletter_card.py
