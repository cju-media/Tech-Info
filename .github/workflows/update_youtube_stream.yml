name: Update YouTube Stream Description

on:
  # No standalone hourly cron here: "Generate YouTube Description" already runs
  # hourly via its own chain off "Check Worship Scripts", so the workflow_run
  # trigger below already fires this job roughly every hour without a separate poll.
  workflow_run:
    workflows: ["Generate YouTube Description"]
    types:
      - completed
  push:
    paths:
      - 'Youtube Processing/timings.txt'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even on or after the service day'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib python-dateutil pytz

      - name: Run update script
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: cd "Youtube Processing" && python update_youtube_stream.py
