name: Drive Upload Notification

on:
  repository_dispatch:
    types: [drive_upload_complete]
  workflow_dispatch:

jobs:
  notify-cameron:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send iMessage
        run: |
          python3 -c '
          import os, json, subprocess
          try:
              phones_path = os.path.join("Scheduling", "Team Data", "team_phones.json")
              with open(phones_path, "r") as f:
                  phones = json.load(f)
              cameron_phone = phones.get("Cameron")
              if not cameron_phone:
                  print("Could not find Cameron phone number.")
                  exit(1)

              message = "New worship scripts and script titles have been uploaded to Google Drive."
              payload = json.dumps({"to": cameron_phone, "message": message})

              print(f"Sending via Shortcuts to {cameron_phone}...")
              process = subprocess.Popen(["shortcuts", "run", "SendTechMessage"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              stdout, stderr = process.communicate(input=payload)

              if process.returncode == 0:
                  print("Successfully sent iMessage notification via Shortcut.")
              else:
                  print(f"Failed to send iMessage via Shortcut. Error: {stderr}")

                  # Fallback to osascript
                  print("Attempting fallback to osascript...")
                  escaped_message = message.replace("\\\\", "\\\\\\\\").replace("\"", "\\\\\"")
                  applescript = f"""
                  tell application "Messages"
                      set targetService to 1st service whose service type = iMessage
                      set targetBuddy to buddy "{cameron_phone}" of targetService
                      send "{escaped_message}" to targetBuddy
                  end tell
                  """
                  subprocess.run(["osascript", "-e", applescript], check=True, capture_output=True, text=True)
                  print("Successfully sent iMessage via fallback osascript.")
          except Exception as e:
              print(f"Error preparing iMessage: {e}")
              exit(1)
          '
