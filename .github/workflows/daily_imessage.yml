name: Send Daily iMessage Reminders

on:
  schedule:
    - cron: '0 3 * * *'  # 8 PM PDT (previous night) for early morning shifts (<= 7am)
    - cron: '0 12 * * *' # 5 AM PDT for regular shifts (> 7am)
  workflow_dispatch:

jobs:
  send-daily-imessages:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for WeasyPrint
        run: |
          brew install pango || true

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas weasyprint

      - name: Run schedule script in iMessage Reminder Mode
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          DRY_RUN: '0'
          RUN_MODE: 'imessage_reminder'
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python3 send_weekly_schedule.py
