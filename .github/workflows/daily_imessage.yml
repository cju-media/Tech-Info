name: Send Daily iMessage Reminders

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  send-daily-imessages:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Clean runner workspace
        run: rm -rf $GITHUB_WORKSPACE/.git || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for WeasyPrint
        run: |
          brew install python@3.10 pango

      - name: Install dependencies
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install pandas weasyprint

      - name: Run schedule script in iMessage Reminder Mode
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          DRY_RUN: '0'
          RUN_MODE: 'imessage_reminder'
        run: python3.10 send_weekly_schedule.py
