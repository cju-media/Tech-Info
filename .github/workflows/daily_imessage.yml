name: Send Daily iMessage Reminders

on:
  schedule:
    - cron: '0 3 * * *'  # 8 PM PDT (previous night) for early morning shifts (<= 7am)
    - cron: '0 14 * * *' # 7 AM PDT for regular shifts (> 7am)
  workflow_dispatch:

jobs:
  send-daily-imessages:
    runs-on: [self-hosted, macOS]
    env:
      RUNNER_TOOL_CACHE: /tmp/runner_tool_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies for WeasyPrint
        run: |
          brew install pango

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas weasyprint

      - name: Run schedule script in iMessage Reminder Mode
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          DRY_RUN: '0'
          RUN_MODE: 'imessage_reminder'
        run: python send_weekly_schedule.py
