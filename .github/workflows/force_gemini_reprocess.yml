name: Force Gemini Reprocess

on:
  workflow_dispatch:

jobs:
  reprocess-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth python-dateutil requests pypdf google-genai

      - name: Run force reprocess script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python force_gemini_reprocess.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add worship_scripts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Force reprocess worship scripts via Gemini" && git push)
