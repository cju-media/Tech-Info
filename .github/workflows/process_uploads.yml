name: Process Uploads Queue

on:
  push:
    paths:
      - 'uploads_queue/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-uploads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client python-dateutil pytz requests

      - name: Process Queue
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          PAT: ${{ secrets.PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python "Worship Scripts/upload_queue_to_drive.py"

      - name: Commit cleanup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploads_queue/
          # Only commit if there are changes (files deleted)
          git diff --quiet && git diff --staged --quiet || git commit -m "Cleanup processed uploads"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}