name: Process Uploads Queue

on:
  push:
    paths:
      - 'Utilities/uploads_queue/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-uploads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client python-dateutil pytz requests

      - name: Process Queue
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          PAT: ${{ secrets.PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python "Worship Scripts/worship workflows/upload_queue_to_drive.py"

      - name: Commit cleanup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # git add on a nonexistent path is a hard (exit 128) failure, not
          # a no-op - and the queue directory genuinely stops existing once
          # the last file in it is removed (git doesn't track empty dirs).
          # That's the normal end state after successfully draining the
          # queue, so guard against it instead of failing the whole job.
          if [ -d "Utilities/uploads_queue" ]; then
            git add Utilities/uploads_queue/
          fi
          # A worship-service thumbnail uploaded before this week's OW gets
          # stashed here instead of going straight to a stream -- see
          # defer_stream_creation() in upload_queue_to_drive.py -- so pick
          # that up too when present.
          if [ -d "Youtube Processing/pending_stream" ]; then
            git add "Youtube Processing/pending_stream/"
          fi
          # Only commit if there are changes (files deleted)
          git diff --quiet && git diff --staged --quiet || git commit -m "Cleanup processed uploads"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}