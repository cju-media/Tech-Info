name: Generate YouTube Description

on:
  workflow_run:
    workflows: ["Check Worship Scripts"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-description:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pypdf python-dateutil

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cd "Youtube Descriptions" && python generate_youtube_description.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A worship_scripts.json "Processed Scripts/"

          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: Generate YouTube description text files"
            git pull --rebase origin ${{ github.event.workflow_run.head_branch || github.ref_name }}
            git push
          else
            echo "No changes to commit."
          fi
