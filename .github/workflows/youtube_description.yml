name: Generate YouTube Description

on:
  workflow_run:
    workflows: ["Check Worship Scripts"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force Gemini processing for upcoming scripts'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-description:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz python-dateutil requests

      - name: Run script
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: cd "Youtube Processing" && python generate_youtube_description.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A "Worship Scripts/worship_scripts.json" || true
          git add -A "Youtube Processing/Description.txt" || true
          git add -A "Youtube Processing/chapters.txt" || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Generate YouTube description text files" && git pull --rebase origin ${{ github.event.workflow_run.head_branch || github.ref_name }} && git push)
